server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las imágenes pueden pesar hasta 20 MB (TAMANO_MAXIMO_MB); se deja margen.
    client_max_body_size 25m;

    # Reenvía la API al contenedor del backend (mismo origen: no hace falta CORS).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # El bicúbico a 4K puede tardar: se da tiempo de sobra.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
